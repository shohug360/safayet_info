<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Al Safayat — Management Professional</title>
  <meta name="description" content="The personal portfolio of Al Safayat, a management professional focused on strategy, leadership, operations, and meaningful organizational impact." />

  <!-- Open Graph -->
  <meta property="og:title" content="Al Safayat — Management Professional" />
  <meta property="og:description" content="Turning complexity into clarity, strategy into action." />
  <meta property="og:type" content="website" />

  <!-- Favicon (inline SVG wordmark mark) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312121a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23c9a96e' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ================= NAVIGATION ================= -->
  <header class="site-header" aria-label="Main navigation">
    <div class="container header-inner">
      <a class="wordmark" href="#top" aria-label="AL SAFAYAT — home">
        <span class="wordmark-mark" aria-hidden="true">A</span>
        <span class="wordmark-text">AL SAFAYAT</span>
      </a>

      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>

      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </header>

  <main id="main">

    <!-- ================= HERO ================= -->
    <section class="hero" id="top" aria-label="Introduction">
      <span class="hero-wordmark" aria-hidden="true">AL SAFAYAT</span>
      <span class="hero-orbit" aria-hidden="true"></span>
      <div class="container">
        <div class="hero-inner">
          <span class="eyebrow" id="hero-eyebrow"></span>
          <h1 class="hero-headline" id="hero-headline"></h1>
          <p class="hero-support" id="hero-support"></p>
          <div class="hero-actions" id="hero-actions"></div>
        </div>
      </div>
      <div class="hero-scroll" aria-hidden="true">
        <span id="hero-scroll-hint"></span>
        <span class="hero-scroll-line"></span>
      </div>
    </section>

    <!-- ================= MARQUEE TICKER ================= -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <!-- ================= ABOUT ================= -->
    <section class="section about" id="about" aria-labelledby="about-headline">
      <div class="container">
        <div class="section-grid about-grid">
          <div class="section-copy">
            <span class="eyebrow" id="about-eyebrow"></span>
            <h2 class="section-headline" id="about-headline"></h2>
            <div class="about-paragraphs" id="about-paragraphs"></div>
          </div>
          <figure class="about-photo" id="about-photo" tabindex="0">
            <div class="photo-frame" id="photo-frame"></div>
            <figcaption class="photo-caption" id="photo-caption"></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <!-- ================= EXPERTISE ================= -->
    <section class="section expertise" id="expertise" aria-labelledby="expertise-headline">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow" id="expertise-eyebrow"></span>
          <h2 class="section-headline" id="expertise-headline"></h2>
          <p class="section-intro" id="expertise-intro"></p>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-diamond">◆</span>
            <span class="ornament-line"></span>
          </div>
        </div>
        <ul class="expertise-grid" id="expertise-grid"></ul>
      </div>
    </section>

    <!-- ================= EXPERIENCE ================= -->
    <section class="section experience" id="experience" aria-labelledby="experience-headline">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow" id="experience-eyebrow"></span>
          <h2 class="section-headline" id="experience-headline"></h2>
          <p class="section-intro" id="experience-intro"></p>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-diamond">◆</span>
            <span class="ornament-line"></span>
          </div>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- ================= PHILOSOPHY ================= -->
    <section class="section philosophy" id="philosophy" aria-labelledby="philosophy-headline">
      <div class="container">
        <div class="philosophy-inner">
          <div class="ornament ornament-center" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-diamond">◆</span>
            <span class="ornament-line"></span>
          </div>
          <span class="eyebrow" id="philosophy-eyebrow"></span>
          <blockquote class="philosophy-quote" id="philosophy-quote"></blockquote>
          <div class="ornament ornament-center attribution-rule" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-diamond">◆</span>
            <span class="ornament-line"></span>
          </div>
          <cite class="philosophy-attribution" id="philosophy-attribution"></cite>
          <ul class="principles" id="principles"></ul>
        </div>
      </div>
    </section>

    <!-- ================= CONTACT ================= -->
    <section class="section contact" id="contact" aria-labelledby="contact-headline">
      <div class="container">
        <div class="contact-inner">
          <span class="contact-corner contact-corner--tr" aria-hidden="true"></span>
          <span class="contact-corner contact-corner--bl" aria-hidden="true"></span>
          <div class="ornament ornament-center" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-diamond">◆</span>
            <span class="ornament-line"></span>
          </div>
          <span class="eyebrow" id="contact-eyebrow"></span>
          <h2 class="section-headline" id="contact-headline"></h2>
          <p class="section-intro" id="contact-intro"></p>
          <div class="contact-channels" id="contact-channels"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer" aria-label="Footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="wordmark-text" id="footer-wordmark"></span>
        <span class="footer-tagline" id="footer-tagline"></span>
      </div>
      <nav class="footer-nav" aria-label="Footer navigation"></nav>
      <div class="ornament ornament-center footer-rule" aria-hidden="true">
        <span class="ornament-line"></span>
        <span class="ornament-diamond">◆</span>
        <span class="ornament-line"></span>
      </div>
      <div class="footer-bottom">
        <span id="footer-copyright"></span>
        <a class="footer-top" href="#top" id="footer-top-link"><span id="footer-back-to-top"></span></a>
      </div>
    </div>
  </footer>

  <!-- Content data -->
  <script src="js/data.js"></script>
  <!-- Interactions & rendering -->
  <script src="js/script.js"></script>
</body>
</html>
